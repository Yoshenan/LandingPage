<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - User Management</title>
  <script>
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.documentElement.classList.add('light');
  }
</script>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Page Header -->
    <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">User Management Dashboard</h1>
        <p class="text-sm text-slate-400">Create, manage, and assign system access roles</p>
      </div>
      <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded border border-slate-700 transition">
        &larr; Back to Dashboard
      </a>
    </header>

    <!-- Main Content Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Section 1: Create User Form -->
      <section class="bg-slate-900 border border-slate-800 rounded-lg p-6 h-fit shadow-xl">
        <h2 class="text-lg font-semibold text-emerald-400 mb-4 flex items-center gap-2">
          <span>&#43;</span> Add New User
        </h2>

        <form id="add-user-form" class="space-y-4" action="javascript:void(0);" onsubmit="return false;">
          <!-- Username Input -->
          <div>
            <label for="username" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email</label>
            <input 
              type="text"
              id="username" 
              required
              placeholder="user@company.com" 
              class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
            >
          </div>

           

          <!-- Password Input Section with Unique IDs -->
         <!-- Password Input Section with Unique IDs -->
<div>
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>

  <div class="relative w-full flex items-center">
    <input
      type="password"
      id="password"
      class="w-full pr-10 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition"
      required
    />

    <!-- Absolutely positioned eye button -->
    <button
      type="button"
      id="add-toggle-password"
      aria-label="Toggle password visibility"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-emerald-400 focus:outline-none transition-colors flex items-center justify-center"
    >
      <!-- Eye Icon (Show) -->
      <svg id="add-eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
      
      <!-- Eye-Off Icon (Hide) -->
      <svg id="add-eye-off-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908A8.982 8.982 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
      </svg>
    </button>
  </div>

  <!-- Password Strength Indicator -->
  <div class="flex items-center gap-2 mt-2">
    <div class="flex items-center gap-1 text-[11px]">
      <span class="text-slate-500">Strength:</span>
      <span id="add-strength-label" class="strength-label font-semibold text-slate-400">None</span>
    </div>
    <div class="h-1.5 w-16 bg-slate-900 rounded-full overflow-hidden border border-slate-800/80">
      <div id="add-strength-bar" class="strength-bar h-full w-0 transition-all duration-300"></div>
    </div>
  </div>
</div>




          <!-- Company Name Input -->
          <div>
            <label for="companyName" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Company Name</label>
            <select 
              id="companyName" 
              class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
            >
              <option value="Petronas">Petronas</option>
              <option value="BHPetrol">BHPetrol</option>
              <option value="Shell">Shell</option>
              <option value="Petron">Petron</option>
              <option value="Caltex">Caltex</option>
            </select>
          </div>

          <!-- Role Selection -->
          <div>
            <label for="role" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Assign Role</label>
            <select 
              id="role" 
              class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
            >
              <option value="User">User</option>
              <option value="Admin">Admin</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button 
            id="create"
            type="submit" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2 px-4 rounded transition text-sm mt-2"
          >
            Create User
          </button>
        </form>
      </section>

      <!-- Section 2: User List Table -->
      <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-lg p-6 shadow-xl">
        <h2 class="text-lg font-semibold text-blue-400 mb-4">
          Registered Accounts
        </h2>

        <!-- Table Container -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
              <tr>
                <th class="py-3 px-4">Username</th>
                <th class="py-3 px-4">Company</th>
                <th class="py-3 px-4">Role</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <!-- Target tbody for JavaScript dynamic rendering -->
            <tbody id="user-list-body" class="divide-y divide-slate-800/60">
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Section 3: Single Edit User Modal Popup -->
  <div id="edit-user-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 max-w-md w-full shadow-2xl space-y-4">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-lg font-semibold text-emerald-400">Edit User Details</h3>
        <button type="button" id="close-edit-modal-btn" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>

      <!-- Edit Form -->
      <form id="edit-user-form" class="space-y-4" action="javascript:void(0);" onsubmit="return false;">
        <!-- Hidden input for User ID -->
        <input type="hidden" id="edit-user-id" />

        <!-- Username Input -->
        <div>
          <label for="edit-username" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email</label>
          <input 
            type="text" 
            id="edit-username" 
            required
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
          >
        </div>

        <!-- Company Name Select -->
        <div>
          <label for="edit-companyName" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Company Name</label>
          <select 
            id="edit-companyName" 
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
          >
            <option value="Petronas">Petronas</option>
            <option value="BHPetrol">BHPetrol</option>
            <option value="Shell">Shell</option>
            <option value="Petron">Petron</option>
            <option value="Caltex">Caltex</option>
            <option value="ExxonMobil">ExxonMobil</option>
          </select>
        </div>

        <!-- Role Select -->
        <div>
          <label for="edit-role" class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Role</label>
          <select 
            id="edit-role" 
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm"
          >
            <option value="User">User</option>
            <option value="Admin">Admin</option>
          </select>
        </div>


        <div>
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>

  <div class="relative w-full flex items-center">
    <input
      type="password"
      id="edit-password"
      class="w-full pr-10 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition"

    />

    <!-- Absolutely positioned eye button -->
    <button

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

      </svg>
    </button>
  </div>

  <!-- Password Strength Indicator -->
  <div class="flex items-center gap-2 mt-2">
    <div class="flex items-center gap-1 text-[11px]">
      <span class="text-slate-500">Strength:</span>
      <span id="edit-strength-label" class="strength-label font-semibold text-slate-400">None</span>
    </div>
    <div class="h-1.5 w-16 bg-slate-900 rounded-full overflow-hidden border border-slate-800/80">
      <div id="edit-strength-bar" class="strength-bar h-full w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Action Buttons -->
        <div class="flex justify-end gap-3 pt-2">
          <button 
            type="button"

      </form>


</div>
